[project]
name = "project-doc-generator"
version = "0.1.0"
description = "Générateur de documentation projet avec Gemini, Pydantic, Streamlit et ReportLab"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-genai>=1.40.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "reportlab>=4.2.5",
  "streamlit>=1.40.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

